<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하루목록 — 할 일 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="brand">하루목록</p>
        <h1 class="headline">오늘 할 일을 가볍게 정리해요</h1>
        <p class="subline">추가하고, 체크하고, 끝낸 일은 지워보세요.</p>
      </header>

      <main class="app" aria-label="할 일 관리">
        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">할 일 입력</label>
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="무엇을 할까요?"
            maxlength="80"
            autocomplete="off"
            required
          />
          <button type="submit" class="add-btn">추가</button>
        </form>

        <div class="list-meta">
          <p class="count" id="todo-count">할 일 0개</p>
        </div>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <p class="empty" id="empty-message">아직 할 일이 없어요. 위에 적어 추가해 보세요!</p>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
